# Merge these blocks into backend/pyproject.toml. They make the `src` layout importable, turn
# warnings into errors in tests, and define the PEP 8 lint gate. Replace <engine>/<app>_api.

[project]
name = "<project>"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.51.0",   # ASGI server
    "python-multipart>=0.0.9",   # file uploads (multipart/form-data), if you accept them
    "sse-starlette>=2.1",        # Server-Sent Events (progress streams)
    "python-dotenv>=1.0",
    # ... your engine's own dependencies ...
]

# ruff is DECLARED here on purpose: `uv run ruff` does NOT restrict itself to the project env —
# undeclared, uv silently falls back to whatever ruff is on your PATH (brew/pipx/global pip: any
# version, still reading this config), so two machines lint identical code to different results
# and uv.lock records none of it. The floor is a floor, not a ceiling: the gate below runs ruff's
# PREVIEW channel, whose rule set moves between minor releases, so a `uv sync` months from now
# can add rules and turn a green project red on its own. That's the accepted trade — uv.lock
# holds the version steady until you deliberately sync. If a bump ever lands mid-refactor and you
# want the noise gone, add an upper bound (`<0.16`) rather than deleting rules from `select`.
[dependency-groups]
dev = ["pytest>=9.1.1", "httpx2>=2.7.0", "ruff>=0.15.20"]   # httpx2 backs the fastapi TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `src/` is the source root: it holds the <engine> package and the <app>_api web layer.
# `sources = ["src"]` strips the `src/` prefix so both install at the wheel root and import
# cleanly as `<engine>` and `<app>_api`. Add `src/config.py` here too if you keep a top-level
# config module the engine imports as `from config import ...`.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/<engine>", "src/<app>_api"]

[tool.uv]
package = true

# `testpaths` makes the whole suite run with ONE command: `uv run pytest` (from backend/).
# Warnings are errors in tests, so your own code can't introduce a deprecation unnoticed. Add
# narrow, message-pinned `ignore:` lines ONLY for deprecations that live entirely in a
# third-party package already on its latest release — never a blanket mute.
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

# The PEP 8 gate. `make test` runs `ruff check src tests` from backend/; it must print
# "All checks passed!" with zero errors. line-length 100 (not ruff's default 88) is deliberate
# and load-bearing — these templates are written to it — and it stays at [tool.ruff] top level,
# where BOTH the linter and the formatter read it, so the two can never disagree.
[tool.ruff]
line-length = 100
target-version = "py312"   # match requires-python; ruff won't infer it for every rule

# `preview = true` is what makes this a PEP 8 gate at all — WITHOUT IT THIS BLOCK IS THEATRE.
# In ruff, all of E1xx (indentation), E2xx (whitespace) and E3xx (blank lines) — the entire
# classic PEP 8 body — are preview-gated no-ops. `select = ["E"]` alone silently passes
# `def  f( a,b )` and a missing blank line between top-level defs; only the semantic E/W rules
# fire (E401, E402, E501, E7xx, E9xx, W29x, W605). And ruff will NOT warn you: selecting an exact
# code prints `Selection E302 has no effect because preview is not enabled`, but selecting the
# FAMILY prints nothing. The shorthand suppresses the tool's own alarm — that's the trap.
# Preview does a second job too: it's what makes the F401 in a re-exporting <engine>/__init__.py
# autofixable to `X as X` (preserving the export) instead of a hard error whose suggested fix is
# to delete the line. See references/python-style.md.
#
# The set is deliberately SMALL — every rule here is a rule the LIFTED ENGINE must pass, and the
# engine is code you are explicitly not supposed to rewrite:
#   E, W  pycodestyle — this IS PEP 8. Non-negotiable.
#   F     Pyflakes — the debris of a lift: imports orphaned when the UI calls were stripped
#         (F401), names left undefined by a botched extraction (F821, the best cheap "did the
#         lift break?" signal there is).
#   N     pep8-naming — PEP 8 is half naming; drop N and "PEP 8 compliant" is a half-truth.
# NOT selected, on purpose: I (isort) reorders the engine's import blocks, which can break an
# import whose side effect a later one depends on — real risk, cosmetic reward. UP rewrites
# annotations engine-wide: pure churn against a lift you want reviewable. B finds real
# PRE-EXISTING bugs (B006 mutable default) — report those to the user; a refactor is the wrong
# commit to change engine behavior in. S flags the LAN host's 0.0.0.0 bind (S104), which is the
# entire feature. Adopt any of them later, on their own branch, with their own tests.
[tool.ruff.lint]
preview = true
select = ["E", "W", "F", "N"]

# The engine's inherited debt, declared honestly — NOT a mute button. START EMPTY: add ONLY the
# codes your engine actually trips, and only after `ruff check --fix` + the engine's own tests
# proved a fix unsafe (references/python-style.md). N802/N803 renames break every caller; E741
# renames a variable; E722 (`except:` -> `except Exception:`) stops catching KeyboardInterrupt.
# Those are behavior changes wearing a lint fix's clothes. Name codes, never a family, never ALL.
# Keep the reason. Delete a line when the engine outgrows it. Extend the glob to the engine's
# lifted tests if they inherit its camelCase names. Nothing here ever covers src/<app>_api/**.
#[tool.ruff.lint.per-file-ignores]
#"src/<engine>/**" = ["N802", "N803", "E741", "E722"]   # inherited from <old app>; renames break callers
#"src/<engine>/__init__.py" = ["F401"]                  # re-exports; see python-style.md
#
# Side-effect imports (`import readline`, `from models import User` registering a table) look
# unused and ruff's SAFE --fix DELETES them. Declare them here, not with a scattered # noqa:
#[tool.ruff.lint.pyflakes]
#allowed-unused-imports = ["<module.with.import.side.effects>"]

# NOTE: `uv run` re-resolves and can REWRITE uv.lock as a side effect of merely running. For
# any command that shouldn't touch the lock (e.g. the LAN host), use `uv run --frozen`.
